# --- LIGHT CONFIG (display backlight) ---
light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0.5s

# --- TEXT SENSOR CONFIG ---
text_sensor:
  - platform: homeassistant
    id: ha_s1_r3c1
    entity_id: ${s1_r3c1_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: val_s1_r3c1
            text: !lambda |-
              return x.c_str();

  # Predbat status, shown in yellow under the date. "Demand" is displayed as "Free Running".
  - platform: homeassistant
    id: ha_predbat_status
    entity_id: ${status_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: label_status
            text: !lambda |-
              if (x == "Demand") return std::string("Free Running");
              return x;

# --- NUMERIC SENSOR CONFIG ---
sensor:
  - platform: homeassistant
    id: ha_s1_r1c1
    entity_id: ${s1_r1c1_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: val_s1_r1c1
            text: !lambda |-
              return str_sprintf("${s1_r1c1_format}", x);
        - lvgl.widget.update:
            id: icon_s1_r1c1
            text_color: !lambda |-
              if (x > ${s1_r1c1_thresh_0}) return lv_color_hex(${s1_r1c1_thresh_0_color});
              if (x > ${s1_r1c1_thresh_1}) return lv_color_hex(${s1_r1c1_thresh_1_color});
              return lv_color_hex(${s1_r1c1_icon_color});
        # Bolt (energy total) normally, smiley once today's total is above the threshold
        - lvgl.label.update:
            id: icon_s1_r1c1
            text: !lambda |-
              if (x > ${s1_r1c1_thresh_0}) return std::string("${s1_r1c1_thresh_0_icon}");
              if (x > ${s1_r1c1_thresh_1}) return std::string("${s1_r1c1_thresh_1_icon}");
              return std::string("${s1_r1c1_icon}");

  - platform: homeassistant
    id: ha_s1_r1c2
    entity_id: ${s1_r1c2_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: val_s1_r1c2
            text: !lambda |-
              return str_sprintf("${s1_r1c2_format}", x);
